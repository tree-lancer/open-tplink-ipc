name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static Linux binary
        run: |
          docker run --rm \
            --env GITHUB_REF --env GITHUB_REF_NAME \
            --volume "$PWD:/work" --workdir /work alpine:3.22 \
            sh scripts/build-release-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/tplink-ipc-mcp-linux-x86_64 dist/SHA256SUMS \
            --verify-tag --generate-notes
